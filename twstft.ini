[mail]
server = roasf2.roa
from   = lee_satres@hora
to     = luisba@roa.es

# ---------------------------------------------------------------------------
# Valores por defecto para los laboratorios remotos
# Se aplican cuando no se define explícitamente en la sección [lab XXXX]
# ---------------------------------------------------------------------------
[DEFAULT]
sw       = 9
calr     = 999999999
ci       = 999
esdvar   = 999999999
esig     = 99999
rsig     = 99999
refdelay = 0
prn      = 0
estacion = ROA01

# ---------------------------------------------------------------------------
# Laboratorios remotos — HORA PAR (minutos 0-59)
#
# Campos:
#   nombre   = identificador ITU del laboratorio remoto (hasta 4 chars + 2 dígitos)
#   letra    = carácter ASCII identificador de la estación en el plan de sesiones
#   minuto   = minuto de inicio de la sesión (0-59 hora par, 60-119 hora impar)
#   prn      = código PN del laboratorio remoto
#   link     = enlace satelital usado (referencia a [link XX])
#   estacion = antena local usada en esta sesión (referencia a [estacion XXXX])
#   sw       = tipo de datos ITU (0,1,2,5,6,9)
#   calr     = resultado de calibración (ns); 999999999 = no calibrado
#   ci       = identificador de calibración; 999 = no calibrado
#   esdvar   = variación retardo estación terrena (ns); 999999999 = no disponible
#   esig     = incertidumbre de esdvar (ns)
#   rsig     = incertidumbre de refdelay (ns)
#   refdelay = retardo de referencia UTC(lab) - 1PPSTX (s)
# ---------------------------------------------------------------------------

[lab PL01]
nombre   = PL01
letra    = p
minuto   = 0
prn      = 10
link     = 23
sw       = 1
