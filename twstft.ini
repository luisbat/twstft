# ===========================================================================
# twstft.ini — Configuración del sistema TWSTFT
# ROA — Real Instituto y Observatorio de la Armada
# Versión: 1.0
# ===========================================================================

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Red
# ---------------------------------------------------------------------------
[network]
puerto = 3020

# ---------------------------------------------------------------------------
# Ficheros
# raw, itu y rp: <base>/<unit_id>/<subdir>/fichero
# log:           <base>/log/  (compartido por todas las unidades)
# ema:           ruta absoluta independiente (no depende de unit_id)
# ---------------------------------------------------------------------------
[ficheros]
base       = /home/tw/satres
raw_dir    = raw
ema_dir    = /home/tw/ema
itu_dir    = itu
rp_dir     = rp
log_dir    = /home/tw/satres/log
itu_remoto = /home/tw/satres/itu_remoto   # ficheros ITU de otros labs (NFS o copia)
diff_dir   = diff                          # subdirectorio <base>/diff/ para resultados

# ---------------------------------------------------------------------------
# Laboratorio local (estación propia)
# par   = laboratorio usado en la hora par   (minutos  0-59)
# impar = laboratorio usado en la hora impar (minutos 60-119)
# ---------------------------------------------------------------------------
[local]
par   = ROA01
impar = ROA11

# ---------------------------------------------------------------------------
# Metadatos del fichero ITU (Anexo 2, UIT-R TF.1153-4)
# ---------------------------------------------------------------------------
[itu]
format   = 01
lab      = ROA
rev_date = 2022-09-14
ref_frame = WGS-84
loc_mon  = NO
modem    = SATRE, 448
comments = CHIP RATES (LINKS 19 and 21): 2.5 Mchip/s    MODEM SW VER 4.15.2 DATE 2008-09-27
ntl      = 119

# ---------------------------------------------------------------------------
# Estaciones terrenas (antenas físicas)
# Una sección por antena.
# latitud/longitud en formato: [N|S] GG MM SS.SSS
# altura en metros
# ---------------------------------------------------------------------------
[estacion ROA01]
nombre   = ROA01
latitud  = N 36 27 51.530
longitud = W 006 12 22.333
altura   = 74.67

[estacion ROA02]
nombre   = ROA02
latitud  = N 36 27 51.225
longitud = W 006 12 22.335
altura   = 74.98

# ---------------------------------------------------------------------------
# Links satelitales
# Una sección por enlace.
# nlo_dir:  E (Este) u W (Oeste)
# nlo_grad/min/seg: longitud nominal del satélite
# xpndr:    retardo diferencial del transpondedor (ns); 999999999 = desconocido
# sat_ntx:  frecuencia de bajada al terreno (MHz) — recepción estación local
# sat_nrx:  frecuencia de subida al satélite (MHz) — transmisión estación local
# bw:       ancho de banda del transpondedor (MHz)
# ---------------------------------------------------------------------------
[link 21]
satelite  = TELSTAR 11N
nlo_dir   = E
nlo_grad  = 322
nlo_min   = 27
nlo_seg   = 00.000
xpndr     = 999999999
sat_ntx   = 11497.0600
sat_nrx   = 14047.7400
bw        = 3.9

[link 23]
satelite  = TELSTAR 11N
nlo_dir   = E
nlo_grad  = 322
nlo_min   = 27
nlo_seg   = 00.000
xpndr     = 999999999
sat_ntx   = 10953.9500
sat_nrx   = 14253.9500
bw        = 4.1

# ---------------------------------------------------------------------------
# Calibraciones
# Una sección por calibración identificada por su CI (Calibration Identifier).
# tipo:  PORT ES REL | PORT ES ABS | PORT SS REL | PORT SS ABS |
#        GPS | PORT CLOCK | CIRCULAR T | TRIANGLE CLOSURE | CAL nnn BRIDGED
# mjd:   Día Juliano Modificado de la calibración
# incert: incertidumbre combinada normalizada (ns)
# ---------------------------------------------------------------------------
[cal 571]
tipo   = TRIANGLE CLOSURE
mjd    = 59397
incert = 2.000

[cal 579]
